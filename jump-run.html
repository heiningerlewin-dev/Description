<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Würfelsprung — Jump 'n' Run</title>
<style>
  :root {
    --ink: #f4f7ff;
    --muted: #a9b6cf;
    --accent: #ffd452;
    --panel: rgba(9, 14, 26, 0.82);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #stage { position: fixed; inset: 0; display: block; }

  /* ---- HUD ---------------------------------------------------------- */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    align-items: center;
    padding: 12px 16px;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  #hud .box { display: flex; align-items: center; gap: 7px; }
  #hud .label { color: var(--muted); font-size: 11px; }
  #hud .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  #hud .spacer { flex: 1; }

  #lives { display: flex; gap: 5px; }
  #lives i {
    width: 13px; height: 13px;
    border-radius: 3px;
    background: linear-gradient(150deg, #fffdf5, #e4dcc6);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.4);
    position: relative;
  }
  #lives i::after {
    content: "";
    position: absolute;
    inset: 4.5px;
    border-radius: 50%;
    background: #2a3040;
  }

  /* ---- Overlays ------------------------------------------------------ */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(4, 7, 14, 0.55);
    backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }

  .card {
    max-width: 470px;
    width: 100%;
    padding: 26px 28px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    text-align: center;
  }

  .card h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .card h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: 0.06em; }
  .card p { margin: 0 0 14px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
  .card strong { color: var(--ink); }
  .card .big { color: var(--accent); font-size: 15px; }

  .keys {
    margin: 0 auto 16px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 14px;
    font-size: 12.5px;
    text-align: left;
    color: var(--muted);
    width: max-content;
  }
  .keys span:nth-child(odd) { color: var(--ink); }

  kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    font: inherit;
    font-size: 11.5px;
  }

  button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0a1020;
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b8912f;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8912f; }

  /* ---- Touch controls ------------------------------------------------ */
  #touch {
    position: fixed;
    inset: auto 0 0 0;
    z-index: 2;
    display: none;
    justify-content: space-between;
    padding: 0 18px 22px;
  }
  #touch.on { display: flex; }
  #touch .pad { display: flex; gap: 14px; }
  #touch .btn {
    width: 66px; height: 66px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.22);
    display: grid;
    place-items: center;
    font-size: 22px;
    color: var(--ink);
  }
  #touch .btn.wide { width: 84px; }
  #touch .btn:active { background: rgba(255, 255, 255, 0.28); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="box"><span class="label">Punkte</span><span class="value" id="score">0</span></div>
  <div class="box"><span class="label">Münzen</span><span class="value" id="coins">0</span></div>
  <div class="box"><span class="label">Leben</span><span id="lives"></span></div>
  <div class="spacer"></div>
  <div class="box"><span class="label">Level</span><span class="value" id="world">1</span></div>
  <div class="box"><span class="label">Zeit</span><span class="value" id="time">0</span></div>
</div>

<div id="overlay"></div>

<div id="touch">
  <div class="pad">
    <div class="btn" data-key="left">◀</div>
    <div class="btn" data-key="right">▶</div>
  </div>
  <div class="pad">
    <div class="btn wide" data-key="jump">▲</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =======================================================================
  // Tuning — the whole game feel lives in these numbers.
  // =======================================================================
  const TILE = 32;
  const ROWS = 17;                    // every level is 17 tiles tall
  const VIEW_H = TILE * ROWS;         // 544 virtual pixels
  const MIN_VIEW_W = TILE * 26;       // never show less than 26 tiles across
  const DT = 1 / 120;                 // fixed physics step

  const GRAVITY      = 2000;
  const HOLD_GRAVITY = 0.55;          // gravity scale while rising and holding jump
  const MAX_FALL     = 900;
  const JUMP_VEL     = 560;
  const WALK_MAX     = 190;
  const RUN_MAX      = 300;
  const GROUND_ACCEL = 1500;
  const AIR_ACCEL    = 1000;
  const FRICTION     = 1900;
  const COYOTE       = 0.09;          // grace period after leaving a ledge
  const JUMP_BUFFER  = 0.11;          // grace period for pressing jump too early
  const STOMP_BOUNCE = 430;
  const SPRING_VEL   = 900;

  const WALKER_SPEED = 58;
  const FLYER_SPEED  = 70;

  const SOLID = new Set(["#", "x"]);

  // =======================================================================
  // Levels
  //
  // Map legend:  #  solid block      x  crate (breaks when head-butted)
  //              o  coin             ^  spikes
  //              S  spring           e  walker        f  flyer
  //              P  start            G  goal flag     .  air
  //
  // Rows are written in blocks of ten columns so the grid stays countable.
  // Moving platforms are not in the map — they live in `platforms`, in tile
  // units: x/y = start tile, w = width, dx/dy = travel distance.
  // =======================================================================
  const DOTS = "..........";
  const air = (n) => DOTS.repeat(n);

  const LEVELS = [
    {
      name: "Wiesenweg",
      theme: "meadow",
      platforms: [{ x: 64, y: 14, w: 4, dx: 2, speed: 70 }],
      map: [
        /*  0 */ air(10),
        /*  1 */ air(10),
        /*  2 */ air(10),
        /*  3 */ air(10),
        /*  4 */ air(10),
        /*  5 */ air(10),
        /*  6 */ air(10),
        /*  7 */ air(10),
        /*  8 */ air(8)  + "ooo......." + DOTS,
        /*  9 */ air(10),
        /* 10 */ air(2)  + "ooo......." + air(5)      + ".....ooo.." + DOTS,
        /* 11 */ DOTS    + ".........#" + "####......" + DOTS       + "....######" + "###......." + "....ooo..." + DOTS + ".....xxx.." + DOTS,
        /* 12 */ "........oo" + "o...ooo..." + DOTS   + "ooo......." + "...#######" + "###......." + DOTS + DOTS + DOTS + DOTS,
        /* 13 */ "...P......" + DOTS        + ".......e.." + ".......e.." + "..########" + "###.....^^" + "..e......." + DOTS + "S........." + ".....G....",
        /* 14 */ "##########" + "####...###" + "##########" + "...#######" + "##########" + "##########" + "####......" + "##########" + "##########" + "##########",
        /* 15 */ "##########" + "####...###" + "##########" + "...#######" + "##########" + "##########" + "####......" + "##########" + "##########" + "##########",
        /* 16 */ "##########" + "####...###" + "##########" + "...#######" + "##########" + "##########" + "####......" + "##########" + "##########" + "##########",
      ],
    },
    {
      name: "Steinbruch",
      theme: "canyon",
      platforms: [
        { x: 33, y: 13, w: 2, dy: -4, speed: 55 },   // lift out of the shaft
        { x: 64, y: 14, w: 4, dx: 3, speed: 65 },    // raft across the wide pit
      ],
      map: [
        /*  0 */ air(10),
        /*  1 */ air(10),
        /*  2 */ air(10),
        /*  3 */ air(10),
        /*  4 */ air(10),
        /*  5 */ air(10),
        /*  6 */ air(10),
        /*  7 */ air(10),
        /*  8 */ air(3) + "........oo" + "ooo......." + air(5),
        /*  9 */ air(3) + "........##" + "###..f...." + air(5),
        /* 10 */ air(5) + "........oo" + "o........." + DOTS + "....^^..e." + "......G...",
        /* 11 */ DOTS + ".......e.." + air(3) + "........xx" + "x........." + "........##" + "##########" + "##########",
        /* 12 */ DOTS + "....######" + DOTS + DOTS + "........oo" + "o........." + DOTS + ".......###" + "##########" + "##########",
        /* 13 */ "..P......." + "...#######" + ".....ooo.." + DOTS + DOTS + ".....^^..." + "..e......." + "......####" + "##########" + "##########",
        /* 14 */ "##########" + "...#######" + "....######" + "##....####" + "########.." + "..########" + "####......" + ".#########" + "##########" + "##########",
        /* 15 */ "##########" + "...#######" + "....######" + "##....####" + "########.." + "..########" + "####......" + ".#########" + "##########" + "##########",
        /* 16 */ "##########" + "...#######" + "....######" + "##....####" + "########.." + "..########" + "####......" + ".#########" + "##########" + "##########",
      ],
    },
    {
      name: "Himmelspfad",
      theme: "night",
      platforms: [
        { x: 24, y: 12, w: 3, dx: 6, speed: 70 },   // ferry across the first chasm
        { x: 39, y: 11, w: 3, dy: -4, speed: 55 },  // lift, docks flush with 33–38
        { x: 74, y: 9, w: 3, dx: 6, speed: 80 },    // raft, docks flush with 68–73
      ],
      map: [
        /*  0 */ air(10),
        /*  1 */ air(10),
        /*  2 */ air(10),
        /*  3 */ air(10),
        /*  4 */ air(10),
        /*  5 */ air(5) + "......o..." + ".ooo......" + air(3),
        /*  6 */ air(6) + "######...." + air(3),
        /*  7 */ air(4) + "......ooo." + "..f...o..." + air(4),
        /*  8 */ air(4) + "....######" + "#.....S..." + DOTS + "e........." + DOTS + DOTS,
        /*  9 */ air(5) + "....#####." + "........##" + "####......" + DOTS + DOTS,
        /* 10 */ air(3) + "....e.ooo." + air(4) + "......oo.." + DOTS,
        /* 11 */ DOTS + ".........e" + DOTS + "...######." + air(4) + "......xx.." + ".....G....",
        /* 12 */ DOTS + ".ooo...###" + "##........" + air(5) + "....######" + "##########",
        /* 13 */ "..P......." + "#####....." + air(7) + "##########",
        /* 14 */ "########.." + air(8) + "##########",
        /* 15 */ "########.." + air(8) + "##########",
        /* 16 */ "########.." + air(8) + "##########",
      ],
    },
  ];

  const THEMES = {
    meadow: {
      skyTop: "#5fc7f5", skyBottom: "#bdeafd",
      hillFar: "#7fc98a", hillNear: "#4fae63",
      dirt: "#8a5a34", dirtDark: "#6d4526",
      cap: "#54c159", capDark: "#3f9c45",
      crate: "#c98b44", stars: false,
    },
    canyon: {
      skyTop: "#f79a55", skyBottom: "#ffd9a0",
      hillFar: "#a4593f", hillNear: "#7a3d2c",
      dirt: "#9c5a3c", dirtDark: "#7a422a",
      cap: "#d98b46", capDark: "#b06e33",
      crate: "#c98b44", stars: false,
    },
    night: {
      skyTop: "#131a3a", skyBottom: "#3b2a63",
      hillFar: "#22224a", hillNear: "#171733",
      dirt: "#4b3f7a", dirtDark: "#372e5c",
      cap: "#7d6bd6", capDark: "#5f50ab",
      crate: "#a67acb", stars: true,
    },
  };

  // =======================================================================
  // Canvas / view
  // =======================================================================
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let dpr = 1, viewW = MIN_VIEW_W, viewH = VIEW_H, scale = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    // Fit the level height, but keep a minimum world width visible so the
    // game stays playable on narrow (portrait) screens.
    scale = Math.min(h / VIEW_H, w / MIN_VIEW_W);
    viewW = w / scale;
    viewH = h / scale;
  }
  window.addEventListener("resize", resize);
  resize();

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // Stable pseudo-random in [0,1) — used for scenery that must not jitter.
  const hash = (i) => {
    const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  };

  // =======================================================================
  // Game state
  // =======================================================================
  const game = {
    state: "title",          // title | playing | paused | dying | clear | gameover | win
    clock: 0,                // seconds of simulated time
    levelIndex: 0,
    lives: 3,
    score: 0,
    coins: 0,
    levelTime: 0,
    timer: 0,                // countdown used by the transition states
    lastBonus: 0,
    best: loadBest(),
  };

  let level = null;
  const cam = { x: 0, y: 0 };
  const particles = [];
  let shake = 0;

  const player = {
    x: 0, y: 0, w: 24, h: 24,
    vx: 0, vy: 0,
    prevBottom: 0,
    grounded: false,
    groundedAt: -99,
    facing: 1,
    roll: 0,                 // rolling angle of the die, in radians
    squash: 0,               // >0 stretched, <0 squashed
    ride: null,              // platform currently carrying the player
  };

  function loadBest() {
    try { return Number(localStorage.getItem("wuerfelsprung.best")) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("wuerfelsprung.best", String(v)); } catch (e) { /* no storage, no problem */ }
  }

  // =======================================================================
  // Input
  // =======================================================================
  const keys = { left: false, right: false, run: false, jump: false };
  let jumpPressedAt = -99;             // when jump was last freshly pressed

  const KEYMAP = {
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
    ArrowUp: "jump", KeyW: "jump", Space: "jump", KeyJ: "jump",
    ShiftLeft: "run", ShiftRight: "run",
  };

  function pressJump() {
    if (!keys.jump) jumpPressedAt = game.clock;
    keys.jump = true;
  }

  window.addEventListener("keydown", (e) => {
    const action = KEYMAP[e.code];
    if (action) {
      e.preventDefault();
      if (action === "jump") pressJump(); else keys[action] = true;
    }
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "Enter") confirmScreen();
    else if (e.code === "KeyP" || e.code === "Escape") togglePause();
    else if (e.code === "KeyR") restartLevel();
    else if (e.code === "KeyM") audio.muted = !audio.muted;
  });

  window.addEventListener("keyup", (e) => {
    const action = KEYMAP[e.code];
    if (action) { e.preventDefault(); keys[action] = false; }
  });

  window.addEventListener("blur", () => {
    keys.left = keys.right = keys.jump = keys.run = false;
    if (game.state === "playing") togglePause();
  });

  // On-screen controls for touch devices.
  const touchBar = document.getElementById("touch");
  if (window.matchMedia("(pointer: coarse)").matches) touchBar.classList.add("on");
  touchBar.querySelectorAll(".btn").forEach((btn) => {
    const action = btn.dataset.key;
    const down = (e) => {
      e.preventDefault();
      ensureAudio();
      if (action === "jump") pressJump(); else keys[action] = true;
      if (game.state !== "playing") confirmScreen();
    };
    const up = (e) => { e.preventDefault(); keys[action] = false; };
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointerleave", up);
    btn.addEventListener("pointercancel", up);
  });

  // =======================================================================
  // Sound — a couple of oscillators is all a game like this needs.
  // =======================================================================
  const audio = { ctx: null, muted: false };

  function ensureAudio() {
    if (!audio.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio.ctx = new AC();
    }
    if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }

  function tone(freq, dur, { type = "square", vol = 0.14, to = freq, delay = 0 } = {}) {
    const ac = audio.ctx;
    if (!ac || audio.muted) return;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  const sfx = {
    jump:   () => tone(430, 0.13, { to: 720, vol: 0.11 }),
    coin:   () => { tone(1050, 0.06, { type: "triangle", vol: 0.13 });
                    tone(1560, 0.12, { type: "triangle", vol: 0.12, delay: 0.06 }); },
    stomp:  () => tone(300, 0.12, { to: 90, type: "sawtooth", vol: 0.13 }),
    crate:  () => tone(200, 0.1, { to: 120, type: "sawtooth", vol: 0.1 }),
    spring: () => tone(300, 0.22, { to: 1200, type: "triangle", vol: 0.13 }),
    extra:  () => [784, 988, 1319].forEach((f, i) => tone(f, 0.14, { type: "triangle", vol: 0.12, delay: i * 0.08 })),
    hurt:   () => { tone(400, 0.18, { to: 180, vol: 0.14 });
                    tone(180, 0.4, { to: 70, vol: 0.12, delay: 0.16 }); },
    goal:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.17, { type: "triangle", vol: 0.13, delay: i * 0.11 })),
    over:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, { vol: 0.12, delay: i * 0.17 })),
  };

  // =======================================================================
  // Level loading
  // =======================================================================
  function loadLevel(index) {
    const def = LEVELS[index];
    const cols = Math.max(...def.map.map((r) => r.length));
    const grid = def.map.map((row) => row.padEnd(cols, ".").split(""));
    while (grid.length < ROWS) grid.push(".".repeat(cols).split(""));

    level = {
      def,
      theme: THEMES[def.theme],
      cols,
      rows: grid.length,
      grid,
      width: cols * TILE,
      height: grid.length * TILE,
      coins: [],
      spikes: [],
      springs: [],
      enemies: [],
      platforms: [],
      goal: null,
      spawn: { x: 2 * TILE, y: 13 * TILE },
    };

    // Turn map markers into entities and clear them out of the grid, so the
    // grid holds nothing but the collision geometry.
    for (let ty = 0; ty < level.rows; ty++) {
      for (let tx = 0; tx < cols; tx++) {
        const c = grid[ty][tx];
        if (c === "." || c === "#" || c === "x") continue;
        const px = tx * TILE, py = ty * TILE;
        grid[ty][tx] = ".";
        switch (c) {
          case "o":
            level.coins.push({ x: px + 8, y: py + 8, w: 16, h: 16, taken: false, phase: (tx + ty) * 0.7 });
            break;
          case "^":
            level.spikes.push({ x: px + 3, y: py + 14, w: TILE - 6, h: TILE - 14 });
            break;
          case "S":
            level.springs.push({ x: px + 4, y: py + 14, w: TILE - 8, h: TILE - 14, press: 0 });
            break;
          case "e":
            level.enemies.push({
              kind: "walker", x: px + 2, y: py + 8, w: 28, h: 24,
              vx: -WALKER_SPEED, vy: 0, dead: 0, wob: Math.random() * 6,
              homeX: px + 2, homeY: py + 8,
            });
            break;
          case "f":
            level.enemies.push({
              kind: "flyer", x: px + 2, y: py + 6, w: 28, h: 20,
              vx: FLYER_SPEED, vy: 0, dead: 0, wob: Math.random() * 6,
              homeX: px + 2, homeY: py + 6, range: 3 * TILE,
            });
            break;
          case "P":
            level.spawn = { x: px + 4, y: py + 8 };
            break;
          case "G":
            level.goal = { x: px + 12, ty };
            break;
        }
      }
    }

    for (const p of def.platforms || []) {
      level.platforms.push({
        x0: p.x * TILE, y0: p.y * TILE,
        x: p.x * TILE, y: p.y * TILE,
        w: p.w * TILE, h: 14,
        dx: (p.dx || 0) * TILE, dy: (p.dy || 0) * TILE,
        speed: p.speed || 60,
        t: 0, mx: 0, my: 0,
      });
    }

    game.levelTime = 0;
    clearShown = false;
    particles.length = 0;
    respawnPlayer();
  }

  function respawnPlayer() {
    player.x = level.spawn.x;
    player.y = level.spawn.y;
    player.vx = player.vy = 0;
    player.facing = 1;
    player.roll = 0;
    player.squash = 0;
    player.grounded = false;
    player.groundedAt = -99;
    player.ride = null;
    player.prevBottom = player.y + player.h;

    // Bring the squashed enemies back for the next try.
    for (const e of level.enemies) {
      if (!e.dead) continue;
      e.dead = 0;
      e.x = e.homeX;
      e.y = e.homeY;
      e.vy = 0;
      e.vx = e.kind === "walker" ? -WALKER_SPEED : FLYER_SPEED;
    }

    cam.x = clamp(player.x + player.w / 2 - viewW / 2, 0, Math.max(0, level.width - viewW));
    cam.y = clamp(player.y + player.h / 2 - viewH / 2, 0, Math.max(0, level.height - viewH));
  }

  // =======================================================================
  // Collision — one axis at a time, which is all a grid platformer needs.
  // =======================================================================
  function solidAt(tx, ty) {
    if (tx < 0 || tx >= level.cols) return true;    // level edges are walls
    if (ty < 0 || ty >= level.rows) return false;   // open sky, open pit
    return SOLID.has(level.grid[ty][tx]);
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // The span across the movement axis keeps the 1px inset (so resting on the
  // floor does not count as touching a wall), while the leading edge does not
  // (so a body sitting flush against a tile still registers contact).
  function collideX(b) {
    const ty0 = Math.floor(b.y / TILE);
    const ty1 = Math.floor((b.y + b.h - 1) / TILE);
    if (b.vx > 0) {
      const tx = Math.floor((b.x + b.w) / TILE);
      for (let ty = ty0; ty <= ty1; ty++) {
        if (solidAt(tx, ty)) { b.x = tx * TILE - b.w; b.vx = 0; return 1; }
      }
    } else if (b.vx < 0) {
      const tx = Math.floor(b.x / TILE);
      for (let ty = ty0; ty <= ty1; ty++) {
        if (solidAt(tx, ty)) { b.x = (tx + 1) * TILE; b.vx = 0; return -1; }
      }
    }
    return 0;
  }

  function collideY(b, breakCrates) {
    const tx0 = Math.floor(b.x / TILE);
    const tx1 = Math.floor((b.x + b.w - 1) / TILE);
    if (b.vy > 0) {
      const ty = Math.floor((b.y + b.h) / TILE);
      for (let tx = tx0; tx <= tx1; tx++) {
        if (solidAt(tx, ty)) { b.y = ty * TILE - b.h; b.vy = 0; return 1; }
      }
    } else if (b.vy < 0) {
      const ty = Math.floor(b.y / TILE);
      let blocked = false, broke = false;
      for (let tx = tx0; tx <= tx1; tx++) {
        if (!solidAt(tx, ty)) continue;
        if (breakCrates && ty >= 0 && ty < level.rows && level.grid[ty][tx] === "x") {
          breakCrate(tx, ty);
          broke = true;
        } else {
          blocked = true;
        }
      }
      if (blocked) { b.y = (ty + 1) * TILE; b.vy = 0; return -1; }
      if (broke) { b.vy *= 0.4; return -1; }
    }
    return 0;
  }

  function breakCrate(tx, ty) {
    level.grid[ty][tx] = ".";
    burst(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 14, level.theme.crate, 190);
    collectCoin();
    addScore(50);
    sfx.crate();
    shake = Math.max(shake, 4);
  }

  // =======================================================================
  // Simulation
  // =======================================================================
  function stepPlatforms(dt) {
    for (const p of level.platforms) {
      const span = Math.abs(p.dx) + Math.abs(p.dy);
      if (span === 0) { p.mx = p.my = 0; continue; }
      p.t += (p.speed / span) * dt;
      // Ping-pong 0 → 1 → 0, eased so the turnarounds are not jerky.
      const cycle = p.t % 2;
      const k = cycle < 1 ? cycle : 2 - cycle;
      const eased = 0.5 - 0.5 * Math.cos(Math.PI * k);
      const nx = p.x0 + p.dx * eased;
      const ny = p.y0 + p.dy * eased;
      p.mx = nx - p.x;
      p.my = ny - p.y;
      p.x = nx;
      p.y = ny;
    }
  }

  function stepPlayer(dt) {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const maxSpeed = keys.run ? RUN_MAX : WALK_MAX;
    const accel = player.grounded ? GROUND_ACCEL : AIR_ACCEL;

    if (dir !== 0) {
      player.vx = clamp(player.vx + dir * accel * dt, -maxSpeed, maxSpeed);
      player.facing = dir;
    } else if (player.grounded) {
      const drop = FRICTION * dt;
      player.vx = Math.abs(player.vx) <= drop ? 0 : player.vx - Math.sign(player.vx) * drop;
    }

    // Jump: coyote time + input buffering, and hold for extra height.
    const wantsJump = game.clock - jumpPressedAt < JUMP_BUFFER;
    const canJump = player.grounded || game.clock - player.groundedAt < COYOTE;
    if (wantsJump && canJump) {
      player.vy = -JUMP_VEL;
      player.grounded = false;
      player.groundedAt = -99;
      jumpPressedAt = -99;
      player.squash = 0.35;
      puff(player.x + player.w / 2, player.y + player.h, 6);
      sfx.jump();
    }

    const g = player.vy < 0 && keys.jump ? GRAVITY * HOLD_GRAVITY : GRAVITY;
    player.vy = Math.min(player.vy + g * dt, MAX_FALL);

    player.prevBottom = player.y + player.h;
    const wasGrounded = player.grounded;

    // Ride whatever platform carried us last frame before moving ourselves.
    if (player.ride) {
      player.x += player.ride.mx;
      player.y += player.ride.my;
      collideX(player);
    }

    player.x += player.vx * dt;
    collideX(player);

    const vyBefore = player.vy;
    player.y += player.vy * dt;
    const vres = collideY(player, true);

    player.grounded = vres === 1;
    player.ride = null;

    // Moving platforms are solid boxes, resolved after the tiles.
    for (const p of level.platforms) {
      if (!overlaps(player, p)) continue;
      const landing = vyBefore >= 0 && player.prevBottom <= p.y + Math.abs(p.my) + 6;
      if (landing) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.ride = p;
      } else if (vyBefore < 0 && player.y > p.y) {
        player.y = p.y + p.h;
        player.vy = 0;
      } else {
        const fromLeft = player.x + player.w / 2 < p.x + p.w / 2;
        player.x = fromLeft ? p.x - player.w : p.x + p.w;
        player.vx = 0;
      }
    }

    if (player.grounded) {
      player.groundedAt = game.clock;
      if (!wasGrounded && vyBefore > 260) {
        player.squash = -Math.min(0.42, vyBefore / 2400);
        puff(player.x + player.w / 2, player.y + player.h, 8);
        if (vyBefore > 520) shake = Math.max(shake, 2.5);
      }
      player.roll += (player.vx * dt) / (player.w / 2);      // roll along the ground
      if (Math.abs(player.vx) > 40 && Math.random() < 0.25) {
        puff(player.x + player.w / 2 - Math.sign(player.vx) * 8, player.y + player.h, 1);
      }
    } else {
      player.roll += player.facing * 3.2 * dt;               // slow tumble in the air
    }
    player.squash += (0 - player.squash) * Math.min(1, dt * 12);
  }

  function stepEnemies(dt) {
    for (const e of level.enemies) {
      if (e.dead) { e.dead += dt; continue; }
      e.wob += dt * 8;

      if (e.kind === "walker") {
        e.x += e.vx * dt;
        if (collideX(e) !== 0) e.vx = e.vx === 0 ? WALKER_SPEED : -e.vx;

        e.vy = Math.min(e.vy + GRAVITY * dt, MAX_FALL);
        e.y += e.vy * dt;
        const landed = collideY(e, false) === 1;

        if (landed) {
          // Turn around at ledges so walkers never fall off their platform.
          const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 2 : e.x - 2) / TILE);
          const below = Math.floor((e.y + e.h + 2) / TILE);
          if (!solidAt(ahead, below)) e.vx = -e.vx;
        }
        if (e.y > level.height + TILE * 2) e.dead = 99;
      } else {
        e.x += e.vx * dt;
        if (Math.abs(e.x - e.homeX) > e.range) {
          e.x = e.homeX + Math.sign(e.x - e.homeX) * e.range;
          e.vx = -e.vx;
        }
        e.y = e.homeY + Math.sin(e.wob * 0.35) * 18;
      }
    }
  }

  function collectCoin() {
    game.coins++;
    if (game.coins % 25 === 0) { game.lives++; sfx.extra(); }
  }

  function stepInteractions() {
    for (const c of level.coins) {
      if (c.taken || !overlaps(player, c)) continue;
      c.taken = true;
      collectCoin();
      addScore(100);
      sparkle(c.x + c.w / 2, c.y + c.h / 2);
      sfx.coin();
    }

    for (const s of level.springs) {
      s.press += (0 - s.press) * 0.15;
      // Fires when the die comes down onto the pad *or* walks into it — the
      // pad sits on a block, so its lower edge is the surface we run along.
      if (player.vy >= 0 && overlaps(player, s) && player.prevBottom <= s.y + s.h + 2) {
        player.y = s.y - player.h;
        player.vy = -SPRING_VEL;
        player.grounded = false;
        player.ride = null;
        player.squash = 0.5;
        s.press = 1;
        sfx.spring();
        puff(s.x + s.w / 2, s.y, 8);
      }
    }

    // Land on an enemy to squash it; touching it any other way hurts.
    for (const e of level.enemies) {
      if (e.dead || !overlaps(player, e)) continue;
      if (player.vy > 40 && player.prevBottom <= e.y + e.h * 0.6) {
        e.dead = 0.0001;
        player.vy = -STOMP_BOUNCE;
        player.squash = 0.45;
        addScore(200);
        burst(e.x + e.w / 2, e.y + e.h / 2, 12, e.kind === "flyer" ? "#c58bf0" : "#9be36a", 150);
        sfx.stomp();
        shake = Math.max(shake, 5);
      } else {
        die();
        return;
      }
    }

    for (const s of level.spikes) {
      if (overlaps(player, s)) { die(); return; }
    }

    if (player.y > level.height + TILE * 3) { die(); return; }

    if (level.goal && player.x + player.w > level.goal.x - 6 && player.x < level.goal.x + 18) {
      clearLevel();
    }
  }

  function addScore(n) {
    game.score += n;
    if (game.score > game.best) { game.best = game.score; saveBest(game.best); }
  }

  function die() {
    if (game.state !== "playing") return;
    game.state = "dying";
    game.timer = 1.3;
    game.lives--;
    player.vx = 0;
    player.vy = -420;
    burst(player.x + player.w / 2, player.y + player.h / 2, 18, "#fff3c4", 220);
    shake = 7;
    sfx.hurt();
  }

  function clearLevel() {
    game.state = "clear";
    game.timer = 1.6;
    game.lastBonus = Math.max(0, Math.round((120 - game.levelTime) * 10));
    addScore(1000 + game.lastBonus);
    sfx.goal();
    for (let i = 0; i < 40; i++) {
      sparkle(player.x + player.w / 2 + (Math.random() - 0.5) * 44,
              player.y + player.h / 2 + (Math.random() - 0.5) * 44);
    }
  }

  // =======================================================================
  // Particles
  // =======================================================================
  function spawnParticle(p) {
    if (particles.length > 400) particles.shift();
    particles.push(p);
  }

  function puff(x, y, n) {
    for (let i = 0; i < n; i++) {
      spawnParticle({
        x, y, vx: (Math.random() - 0.5) * 70, vy: -Math.random() * 50,
        life: 0.35 + Math.random() * 0.25, age: 0, r: 2 + Math.random() * 3,
        color: "rgba(255,255,255,0.75)", grav: 40,
      });
    }
  }

  function burst(x, y, n, color, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.35 + Math.random() * 0.65);
      spawnParticle({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        life: 0.5 + Math.random() * 0.4, age: 0, r: 2 + Math.random() * 3,
        color, grav: 620,
      });
    }
  }

  function sparkle(x, y) {
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      spawnParticle({
        x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 40,
        life: 0.35 + Math.random() * 0.3, age: 0, r: 1.5 + Math.random() * 2,
        color: "#ffe27a", grav: 260,
      });
    }
  }

  function stepParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  // =======================================================================
  // Camera
  // =======================================================================
  function stepCamera(dt) {
    const targetX = player.x + player.w / 2 - viewW * 0.42;
    const targetY = player.y + player.h / 2 - viewH * 0.55;
    const lerp = 1 - Math.pow(0.0001, dt);
    cam.x += (targetX - cam.x) * lerp;
    cam.y += (targetY - cam.y) * lerp;
    cam.x = level.width <= viewW ? (level.width - viewW) / 2 : clamp(cam.x, 0, level.width - viewW);
    cam.y = level.height <= viewH ? (level.height - viewH) / 2 : clamp(cam.y, 0, level.height - viewH);
  }

  // =======================================================================
  // Drawing
  // =======================================================================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    const th = level.theme;
    const g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, th.skyTop);
    g.addColorStop(1, th.skyBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);

    if (th.stars) {
      const span = viewW + 40;
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 90; i++) {
        let sx = (hash(i) * span - cam.x * 0.06) % span;
        if (sx < 0) sx += span;
        const sy = hash(i + 500) * viewH * 0.75;
        ctx.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(game.clock * 2 + i));
        const r = 1.2 + hash(i + 900) * 1.2;
        ctx.fillRect(sx, sy, r, r);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.72)";
      for (let i = 0; i < 7; i++) {
        const cw = 90 + (i % 3) * 40;
        let x = (i * 250 - cam.x * 0.18) % (viewW + 400);
        if (x < -200) x += viewW + 400;
        const y = 46 + (i % 4) * 44;
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.arc(x + cw * 0.25, y - 11, 24, 0, Math.PI * 2);
        ctx.arc(x + cw * 0.5, y + 2, 20, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    hills(0.28, viewH * 0.74, 118, th.hillFar);
    hills(0.55, viewH * 0.86, 84, th.hillNear);
  }

  function hills(factor, baseY, amp, color) {
    const off = cam.x * factor;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, viewH);
    for (let x = 0; x <= viewW; x += 16) {
      const wx = x + off;
      const y = baseY
        - Math.sin(wx * 0.0045) * amp * 0.5
        - Math.sin(wx * 0.0017 + 1.3) * amp * 0.5;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(viewW, viewH);
    ctx.closePath();
    ctx.fill();
  }

  function drawTiles() {
    const th = level.theme;
    const tx0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
    const tx1 = Math.min(level.cols - 1, Math.ceil((cam.x + viewW) / TILE));
    const ty0 = Math.max(0, Math.floor(cam.y / TILE) - 1);
    const ty1 = Math.min(level.rows - 1, Math.ceil((cam.y + viewH) / TILE));

    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const c = level.grid[ty][tx];
        const x = tx * TILE, y = ty * TILE;
        if (c === "#") {
          ctx.fillStyle = (tx + ty) % 2 ? th.dirt : th.dirtDark;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = "rgba(0,0,0,0.16)";
          ctx.fillRect(x, y + TILE - 3, TILE, 3);
          if (!solidAt(tx, ty - 1)) {                 // exposed top → grass cap
            ctx.fillStyle = th.cap;
            ctx.fillRect(x, y, TILE, 9);
            ctx.fillStyle = th.capDark;
            ctx.fillRect(x, y + 9, TILE, 3);
            ctx.fillStyle = "rgba(255,255,255,0.22)";
            ctx.fillRect(x, y, TILE, 2);
          }
        } else if (c === "x") {
          ctx.fillStyle = th.crate;
          ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
          ctx.strokeStyle = "rgba(0,0,0,0.3)";
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
          ctx.beginPath();
          ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + TILE - 3, y + TILE - 3);
          ctx.moveTo(x + TILE - 3, y + 3); ctx.lineTo(x + 3, y + TILE - 3);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.2)";
          ctx.fillRect(x + 2, y + 2, TILE - 4, 2);
        }
      }
    }
  }

  function drawSpikes() {
    ctx.fillStyle = "#cfd8e8";
    for (const s of level.spikes) {
      const n = 3, w = s.w / n;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        ctx.moveTo(s.x + i * w, s.y + s.h);
        ctx.lineTo(s.x + i * w + w / 2, s.y);
        ctx.lineTo(s.x + i * w + w, s.y + s.h);
      }
      ctx.fill();
    }
  }

  function drawSprings() {
    for (const s of level.springs) {
      const h = s.h * (1 - s.press * 0.45);
      const y = s.y + (s.h - h);
      ctx.fillStyle = "#8b93a8";
      for (let i = 0; i < 3; i++) ctx.fillRect(s.x + 2, y + 5 + (i * (h - 6)) / 3, s.w - 4, 3);
      ctx.fillStyle = "#e8564f";
      roundRect(s.x - 2, y, s.w + 4, 6, 3);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillRect(s.x, y + 1, s.w, 1.5);
    }
  }

  function drawCoins() {
    for (const c of level.coins) {
      if (c.taken) continue;
      const spin = game.clock * 4 + c.phase;
      const cx = c.x + c.w / 2;
      const cy = c.y + c.h / 2 + Math.sin(spin * 0.5) * 1.5;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(Math.max(0.15, Math.abs(Math.cos(spin))), 1);
      const g = ctx.createLinearGradient(0, -8, 0, 8);
      g.addColorStop(0, "#ffe98a");
      g.addColorStop(0.5, "#f6c445");
      g.addColorStop(1, "#c8901c");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, 0, 4.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlatforms() {
    for (const p of level.platforms) {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(p.x + 2, p.y + p.h, p.w - 4, 4);
      ctx.fillStyle = "#9aa6c4";
      roundRect(p.x, p.y, p.w, p.h, 4);
      ctx.fill();
      ctx.fillStyle = "#d7deef";
      ctx.fillRect(p.x + 2, p.y + 1.5, p.w - 4, 3);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(p.x + p.w * (0.25 + i * 0.25) - 1.5, p.y + 6, 3, 4);
      }
    }
  }

  function drawEnemies() {
    for (const e of level.enemies) {
      if (e.dead >= 0.55) continue;
      const squash = e.dead ? clamp(e.dead / 0.5, 0, 1) : 0;
      const h = e.h * (1 - squash * 0.8);
      const y = e.y + (e.h - h);
      const bob = e.dead ? 0 : Math.sin(e.wob) * 1.6;

      ctx.save();
      ctx.translate(e.x + e.w / 2, y + h / 2 + bob);
      ctx.globalAlpha = 1 - squash * 0.6;

      if (e.kind === "flyer") {
        const flap = Math.sin(e.wob * 1.6) * 8;
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(side * e.w * 0.28, 0);
          ctx.quadraticCurveTo(side * e.w * 0.78, -10 - flap, side * e.w * 0.5, 4);
          ctx.closePath();
          ctx.fill();
        }
      }

      const body = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      if (e.kind === "flyer") { body.addColorStop(0, "#c58bf0"); body.addColorStop(1, "#7c4bb0"); }
      else { body.addColorStop(0, "#8fe06a"); body.addColorStop(1, "#3f9b3a"); }
      ctx.fillStyle = body;
      roundRect(-e.w / 2, -h / 2, e.w, h, Math.min(9, h / 2));
      ctx.fill();

      if (!e.dead) {
        const look = Math.sign(e.vx) * 2;
        ctx.fillStyle = "#fff";
        for (const dx of [-6, 6]) {
          ctx.beginPath();
          ctx.arc(dx, -h * 0.15, 4.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#20252f";
        for (const dx of [-6, 6]) {
          ctx.beginPath();
          ctx.arc(dx + look, -h * 0.15, 2.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  }

  // Pip layout per face, in unit coordinates around the centre.
  const PIPS = {
    1: [[0, 0]],
    2: [[-0.42, -0.42], [0.42, 0.42]],
    3: [[-0.42, -0.42], [0, 0], [0.42, 0.42]],
    4: [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0.42], [0.42, 0.42]],
    5: [[-0.42, -0.42], [0.42, -0.42], [0, 0], [-0.42, 0.42], [0.42, 0.42]],
    6: [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0], [0.42, 0], [-0.42, 0.42], [0.42, 0.42]],
  };
  // Faces that come past as a die tumbles around one axis.
  const FACE_CYCLE = [1, 2, 6, 5];

  function groundBelow(b) {
    const tx = Math.floor((b.x + b.w / 2) / TILE);
    const from = Math.floor((b.y + b.h) / TILE);
    let best = null;
    for (let ty = from; ty < Math.min(level.rows, from + 8); ty++) {
      if (solidAt(tx, ty)) { best = ty * TILE; break; }
    }
    for (const p of level.platforms) {
      const cx = b.x + b.w / 2;
      if (cx > p.x && cx < p.x + p.w && p.y >= b.y + b.h && (best === null || p.y < best)) best = p.y;
    }
    return best;
  }

  function drawPlayer() {
    const size = player.w;
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;
    const st = player.squash;                         // + stretched, - squashed
    const quarter = Math.round(player.roll / (Math.PI / 2));
    const face = FACE_CYCLE[((quarter % 4) + 4) % 4];
    // Snap to a clean face when standing still, otherwise show the real angle.
    const angle = player.grounded && Math.abs(player.vx) < 8
      ? quarter * (Math.PI / 2)
      : player.roll;

    const gy = groundBelow(player);
    if (gy !== null) {
      const d = clamp(1 - (gy - (player.y + player.h)) / 170, 0.15, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.26 * d})`;
      ctx.beginPath();
      ctx.ellipse(cx, gy - 2, size * 0.5 * d, 4 * d, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(1 - st * 0.5, 1 + st * 0.5);

    const g = ctx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
    g.addColorStop(0, "#fffdf6");
    g.addColorStop(1, "#dcd3bd");
    ctx.fillStyle = g;
    roundRect(-size / 2, -size / 2, size, size, 6);
    ctx.fill();
    ctx.strokeStyle = "rgba(40,44,56,0.55)";
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.fillStyle = "#2b3140";
    const r = size * 0.5 * 0.72;
    for (const [px, py] of PIPS[face]) {
      ctx.beginPath();
      ctx.arc(px * r, py * r, size * 0.085, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGoal() {
    const g = level.goal;
    if (!g) return;
    const baseY = (g.ty + 1) * TILE;
    const topY = baseY - TILE * 4.2;

    ctx.fillStyle = "#c9d2e4";
    ctx.fillRect(g.x - 2, topY, 4, baseY - topY);
    ctx.fillStyle = "#98a3ba";
    ctx.fillRect(g.x - 8, baseY - 5, 16, 5);

    ctx.fillStyle = "#ff5f6d";
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      ctx.lineTo(g.x + 2 + t * 46, topY + 2 + Math.sin(game.clock * 5 - t * 4) * 4 * t + t * 3);
    }
    for (let i = 10; i >= 0; i--) {
      const t = i / 10;
      ctx.lineTo(g.x + 2 + t * 46, topY + 26 + Math.sin(game.clock * 5 - t * 4) * 4 * t - t * 3);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(g.x + 2, topY + 2, 3, 24);
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    if (!level) return;

    drawSky();

    ctx.save();
    const s = shake > 0.05 ? shake : 0;
    const ox = s ? (Math.random() - 0.5) * s : 0;
    const oy = s ? (Math.random() - 0.5) * s : 0;
    ctx.translate(-Math.round(cam.x) + ox, -Math.round(cam.y) + oy);

    drawTiles();
    drawSpikes();
    drawSprings();
    drawGoal();
    drawCoins();
    drawPlatforms();
    drawEnemies();
    drawPlayer();
    drawParticles();

    ctx.restore();
  }

  // =======================================================================
  // HUD + overlays
  // =======================================================================
  const el = {
    score: document.getElementById("score"),
    coins: document.getElementById("coins"),
    lives: document.getElementById("lives"),
    world: document.getElementById("world"),
    time: document.getElementById("time"),
    overlay: document.getElementById("overlay"),
  };

  function updateHud() {
    el.score.textContent = game.score;
    el.coins.textContent = game.coins;
    el.world.textContent = `${game.levelIndex + 1}/${LEVELS.length}`;
    el.time.textContent = Math.floor(game.levelTime);
    const want = Math.max(0, game.lives);
    if (el.lives.childElementCount !== want) el.lives.innerHTML = "<i></i>".repeat(want);
  }

  const CONTROLS = `
    <div class="keys">
      <span><kbd>←</kbd> <kbd>→</kbd></span><span>laufen</span>
      <span><kbd>Leertaste</kbd> / <kbd>↑</kbd></span><span>springen — halten = höher</span>
      <span><kbd>Shift</kbd></span><span>rennen</span>
      <span><kbd>P</kbd></span><span>Pause</span>
      <span><kbd>R</kbd></span><span>Level neu starten</span>
      <span><kbd>M</kbd></span><span>Ton an / aus</span>
    </div>`;

  function showOverlay(html) {
    el.overlay.innerHTML = `<div class="card">${html}</div>`;
    el.overlay.classList.remove("hidden");
    const btn = el.overlay.querySelector("button");
    if (btn) btn.addEventListener("click", confirmScreen);
  }

  function hideOverlay() {
    el.overlay.classList.add("hidden");
    el.overlay.innerHTML = "";
  }

  function screenTitle() {
    showOverlay(`
      <h1>Würfelsprung</h1>
      <p class="big">Ein klassisches Jump 'n' Run — mit einem Würfel.</p>
      <p>Münzen sammeln, auf Gegner hüpfen, Stacheln meiden und die Fahne
         erreichen. Drei Level warten.</p>
      ${CONTROLS}
      <p>${game.best ? `Bestpunktzahl: <strong>${game.best}</strong>` : "&nbsp;"}</p>
      <button>Start</button>`);
  }

  function screenPaused() {
    showOverlay(`<h2>Pause</h2>${CONTROLS}<button>Weiter</button>`);
  }

  function screenClear() {
    const last = game.levelIndex + 1 >= LEVELS.length;
    showOverlay(`
      <h2>Level geschafft!</h2>
      <p><strong>${level.def.name}</strong> in ${game.levelTime.toFixed(1)} s<br>
         Zeitbonus <strong>${game.lastBonus}</strong> &middot;
         Punkte <strong>${game.score}</strong></p>
      <button>${last ? "Finale" : "Weiter"}</button>`);
  }

  function screenWin() {
    showOverlay(`
      <h1>Durchgespielt!</h1>
      <p>Alle drei Level geschafft — <strong>${game.score}</strong> Punkte mit
         <strong>${game.coins}</strong> Münzen.</p>
      <p>${game.score >= game.best ? "Neue Bestpunktzahl!" : `Bestpunktzahl: <strong>${game.best}</strong>`}</p>
      <button>Nochmal</button>`);
  }

  function screenGameOver() {
    showOverlay(`
      <h2>Game Over</h2>
      <p>Der Würfel ist ausgerollt — <strong>${game.score}</strong> Punkte.</p>
      <p>Bestpunktzahl: <strong>${game.best}</strong></p>
      <button>Neues Spiel</button>`);
  }

  // =======================================================================
  // Flow
  // =======================================================================
  let clearShown = false;

  function startGame() {
    game.levelIndex = 0;
    game.lives = 3;
    game.score = 0;
    game.coins = 0;
    loadLevel(0);
    game.state = "playing";
    hideOverlay();
  }

  function nextLevel() {
    if (game.levelIndex + 1 >= LEVELS.length) {
      game.state = "win";
      screenWin();
      return;
    }
    game.levelIndex++;
    loadLevel(game.levelIndex);
    game.state = "playing";
    hideOverlay();
  }

  function restartLevel() {
    if (game.state !== "playing" && game.state !== "paused") return;
    loadLevel(game.levelIndex);
    game.state = "playing";
    hideOverlay();
  }

  function togglePause() {
    if (game.state === "playing") { game.state = "paused"; screenPaused(); }
    else if (game.state === "paused") { game.state = "playing"; hideOverlay(); }
  }

  // The single "OK" action behind Space / Enter / the on-screen button.
  function confirmScreen() {
    ensureAudio();
    switch (game.state) {
      case "title": startGame(); break;
      case "paused": togglePause(); break;
      case "clear": if (clearShown) nextLevel(); break;
      case "gameover":
      case "win": startGame(); break;
    }
  }

  // =======================================================================
  // Main loop — fixed simulation step, render once per frame.
  // =======================================================================
  function simulate(dt) {
    game.clock += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 22);

    if (game.state === "playing") {
      game.levelTime += dt;
      stepPlatforms(dt);
      stepPlayer(dt);
      stepEnemies(dt);
      stepInteractions();
      stepCamera(dt);
    } else if (game.state === "dying") {
      // A little death arc, then respawn or game over.
      player.vy = Math.min(player.vy + GRAVITY * 0.8 * dt, MAX_FALL);
      player.y += player.vy * dt;
      player.roll += 6 * dt;
      game.timer -= dt;
      if (game.timer <= 0) {
        if (game.lives <= 0) { game.state = "gameover"; sfx.over(); screenGameOver(); }
        else { respawnPlayer(); game.state = "playing"; }
      }
    } else if (game.state === "clear") {
      stepPlatforms(dt);
      stepPlayer(dt);
      stepCamera(dt);
      game.timer -= dt;
      if (game.timer <= 0 && !clearShown) { clearShown = true; screenClear(); }
    }

    stepParticles(dt);
  }

  let last = 0, acc = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    let elapsed = (now - last) / 1000;
    last = now;
    if (elapsed > 0.25) elapsed = 0.25;        // never fast-forward after a tab switch

    acc += elapsed;
    let steps = 0;
    while (acc >= DT && steps < 10) {
      simulate(DT);
      acc -= DT;
      steps++;
    }
    if (steps === 10) acc = 0;                 // give up on a backlog we can't catch

    render();
    updateHud();
  }

  loadLevel(0);
  screenTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
